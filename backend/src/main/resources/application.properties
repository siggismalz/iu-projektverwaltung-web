spring.application.name=projektverwaltung
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Nur lokales HTTP. Vor echtem Betrieb HTTPS und Secure-Cookie konfigurieren.
spring.datasource.url=jdbc:h2:file:./daten/projektverwaltung;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# H2 schreibt das Transaktionsprotokoll beim Commit ohne zeitlichen Aufschub.
spring.datasource.hikari.connection-init-sql=SET WRITE_DELAY 0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
app.demo-data=true
